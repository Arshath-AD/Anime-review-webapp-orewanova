{% extends "myapp/base.html" %}

{% block content %}
<div class="container fade-in">
  <div class="card auth-container" style="max-width: 600px;">
    <h2 class="section-title text-center">Edit Anime</h2>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{ anime.title }}" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="5" required>{{ anime.description }}</textarea>
      </div>

      <div class="form-group">
        <label>Genre</label>
        <input type="text" name="genre" value="{{ anime.genre }}" required>
      </div>

      <button type="submit" class="btn-block">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
