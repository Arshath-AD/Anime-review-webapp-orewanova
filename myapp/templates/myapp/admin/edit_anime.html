{% extends "myapp/base.html" %}
{% block content %}
<div class="container fade-in page-spacer">
  <div class="mb-4">
    <a href="{% url 'admin_dashboard' %}" class="btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">← Back to
      Dashboard</a>
  </div>
  <div class="card auth-container" style="max-width: 1000px;">
    <h2 class="section-title text-center">Edit Anime</h2>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-grid">
        <div class="form-column">
          <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" value="{{ anime.title }}" required>
          </div>

          <div class="form-group">
            <label>Short Summary</label>
            <textarea name="summary" rows="2" required>{{ anime.summary }}</textarea>
            <small>Keep it short and concise (max ~120 characters)</small>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="5" required>{{ anime.description }}</textarea>
          </div>

          <div class="form-group">
            <label>Select Genres</label>
            <select name="genres" multiple size="8">
              {% for g in genres %}
              <option value="{{ g.slug }}" {% if g.slug in anime.genres %}selected{% endif %}>
                {{ g.name }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-column">
          <div class="form-group">
            <label>Replace Landscape (Optional)</label>
            <input type="file" name="landscape_image">
          </div>

          <div class="form-group">
            <label>Replace Portrait (Optional)</label>
            <input type="file" name="portrait_image">
          </div>

          <div class="form-group">
            <label>Add New Slides (Optional)</label>
            <input type="file" name="slides" multiple>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-block" style="margin-top: 2rem;">
        Update Anime
      </button>
    </form>
  </div>
</div>
{% endblock %}
