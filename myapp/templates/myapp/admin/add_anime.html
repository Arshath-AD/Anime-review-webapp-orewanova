{% extends "myapp/base.html" %}

{% block content %}
<div class="container fade-in page-spacer">
  <div class="mb-4">
    <a href="{% url 'admin_dashboard' %}" class="btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">← Back to
      Dashboard</a>
  </div>
  <div class="card auth-container" style="max-width: 1000px;">
    <h2 class="section-title text-center">Add Anime</h2>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-grid">
        <!-- Left Column -->
        <div class="form-column">
          <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required>
          </div>

          <div class="form-group">
            <label>Short Summary (for cards)</label>
            <textarea name="summary" rows="2" required></textarea>
            <small>Keep it under 120 characters.</small>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="5" required></textarea>
          </div>

          <div class="form-group">
            <label>Select Genres</label><br>
            <select name="genres" multiple size="8">
              {% for g in genres %}
              <option value="{{ g.slug }}">{{ g.name }}</option>
              {% endfor %}
            </select>
            <small style="color: var(--text-muted); display: block; margin-top: 5px;">
              Hold <strong>Ctrl</strong> (Windows) or <strong>Cmd</strong> (Mac) to select multiple genres.
            </small>
          </div>
        </div>

        <!-- Right Column -->
        <div class="form-column">
          <div class="form-group">
            <label>Add new genre (optional)</label>
            <input type="text" name="new_genre">
          </div>

          <div class="form-group">
            <label>Landscape Thumbnail</label>
            <input type="file" name="landscape_image" accept=".jpg,.jpeg,.png" required>
          </div>

          <div class="form-group">
            <label>Portrait Thumbnail</label>
            <input type="file" name="portrait_image" accept=".jpg,.jpeg,.png" required>
          </div>

          <div class="form-group">
            <label>Slide Images (Multiple Allowed)</label>
            <input type="file" name="slides" multiple accept=".jpg,.jpeg,.png">
            <small style="color: var(--text-muted);">
              You can upload multiple images for the anime detail slider.
            </small>
          </div>
        </div>
      </div>


      <button type="submit" class="btn-block" style="margin-top: 2rem;">Add Anime</button>
    </form>
  </div>
</div>
{% endblock %}
