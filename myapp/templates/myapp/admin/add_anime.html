{% extends "myapp/base.html" %}

{% block content %}
<div class="container fade-in">
  <div class="card auth-container" style="max-width: 600px;">
    <h2 class="section-title text-center">Add Anime</h2>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="5" required></textarea>
      </div>

      <div class="form-group">
        <label>Select Genre</label>
        <select name="genre">
          {% for g in genres %}
          <option value="{{ g.slug }}">{{ g.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Or add a new genre</label>
        <input type="text" name="new_genre" placeholder="Type new genre name...">
      </div>

      <div class="form-group">
        <label>Thumbnail Image</label>
        <input type="file" name="image" accept="image/*" required>
      </div>

      <button type="submit" class="btn-block">Add Anime</button>
    </form>
  </div>
</div>
{% endblock %}
