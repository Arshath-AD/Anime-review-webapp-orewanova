{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orewa Nova</title>
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}?v=1.1">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="/" class="logo">OREWA NOVA</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/#genres">Genres</a>
                {% if user.is_staff %}
                | <a href="{% url 'admin_dashboard' %}">Admin Panel</a>
                {% endif %}

                {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="profile-link">
                    <span class="nav-username">{{ user.username }}</span>
                    <img src="{{ user.profile.image.url }}" class="nav-avatar">
                </a>
                {% else %}
                <a href="/login/" class="btn" >Login</a>
                <a href="/signup/" class="btn">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
